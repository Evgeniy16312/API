services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Must match .env.production — bake into client bundle at build time
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    # Compose also reads project `.env` for ${...} substitution; keep in sync:
    #   ln -sf .env.production .env
    environment:
      NODE_ENV: production
    # RU VPS: some Telegram A-records time out on :443; pin a working edge IP
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    volumes:
      - booking-data:/app/data
      - booking-uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  booking-data:
  booking-uploads:
